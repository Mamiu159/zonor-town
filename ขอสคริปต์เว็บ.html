<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZONOR TOWN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #a7c7d6, #f1f6fb); /* สีพื้นหลังสดใส */
      color: #1a202c;
      margin: 0;
      overflow: hidden;
    }

    /* เอฟเฟ็กต์กระต่ายตก */
    .bunny {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: url('https://img.icons8.com/ios/452/rabbit.png') no-repeat center center;
      background-size: contain;
      animation: bunny-fall 5s ease-in-out infinite;
    }

    @keyframes bunny-fall {
      0% {
        top: -100px;
        transform: translateX(-50%) rotate(0deg);
      }
      50% {
        top: 70%;
        transform: translateX(-50%) rotate(360deg);
      }
      100% {
        top: -100px;
        transform: translateX(-50%) rotate(0deg);
      }
    }

    /* เอฟเฟ็กต์แสงรอบตัวข้อความ */
    .glow-text {
      font-size: 4rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #fbb6ce, #a0aec0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 0 0 15px rgba(255, 182, 206, 0.7), 0 0 30px rgba(160, 174, 192, 0.7);
      }
      50% {
        text-shadow: 0 0 30px rgba(255, 182, 206, 1), 0 0 60px rgba(160, 174, 192, 1);
      }
    }

    /* ส่วนของปุ่มที่เปลี่ยนสี */
    .btn-custom {
      padding: 10px 20px;
      background-color: #fbb6ce;
      color: white;
      border-radius: 25px;
      transition: background-color 0.3s ease-in-out;
    }

    .btn-custom:hover {
      background-color: #f7a0b1;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- กระต่ายตก -->
  <div class="bunny"></div>

  <!-- Navbar -->
  <nav class="bg-white text-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold">ZONOR TOWN</h1>
    <div class="space-x-4">
      <button onclick="showSection('home')" id="btn-home" class="hover:text-pink-400 transition">หน้าหลัก</button>
      <button onclick="showSection('form')" id="btn-form" class="hover:text-pink-400 transition">ลงทะเบียนไวลิส</button>
      <button onclick="showSection('discord')" id="btn-discord" class="hover:text-pink-400 transition">Discord</button>
      <button onclick="showSection('shop')" id="btn-shop" class="hover:text-pink-400 transition">ร้านค้า</button>
    </div>
  </nav>

  <!-- หน้าหลัก -->
  <section id="home" class="flex-grow flex justify-center items-center p-6">
    <h2 class="glow-text text-center text-5xl">ZONOR TOWN</h2>
  </section>

  <!-- หน้าลงทะเบียน -->
  <section id="form" class="hidden-section flex-grow flex items-center justify-center p-6">
    <div class="relative z-10 bg-white bg-opacity-80 rounded-2xl p-6 max-w-md w-full shadow-xl">
      <img src="https://cdn.discordapp.com/attachments/1169591308030066708/1366609741824004107/default.png" alt="Logo" class="mx-auto -mt-16 w-28 h-28 rounded-full shadow-lg"/>

      <h2 class="text-2xl font-bold text-center text-pink-400 mt-4 mb-6">Whitelist</h2>

      <form id="whitelistForm" class="space-y-4">
        <input required name="name" type="text" placeholder="ชื่อ IC" class="w-full px-4 py-2 rounded-lg bg-gray-100 border border-gray-300 focus:ring focus:ring-pink-400"/>
        <input required name="age" type="number" placeholder="อายุ" class="w-full px-4 py-2 rounded-lg bg-gray-100 border border-gray-300"/>
        <textarea required name="experience" placeholder="ลิ้งสตรีม" rows="3" class="w-full px-4 py-2 rounded-lg bg-gray-100 border border-gray-300"></textarea>
        <input required name="discord" type="text" placeholder="Discord (เช่น user#0001)" class="w-full px-4 py-2 rounded-lg bg-gray-100 border border-gray-300"/>
        <input required name="facebook" type="text" placeholder="ลิ้งเฟสบุ๊ค" class="w-full px-4 py-2 rounded-lg bg-gray-100 border border-gray-300"/>
        <button type="submit" class="w-full py-2 bg-pink-500 hover:bg-pink-600 rounded-full font-bold">ส่งแบบฟอร์ม</button>
      </form>

      <div id="status" class="text-green-400 font-bold text-center mt-4 hidden">ส่งข้อมูลเรียบร้อยแล้ว!</div>
    </div>
  </section>

  <!-- หน้า Discord -->
  <section id="discord" class="hidden-section flex-grow flex justify-center items-center">
    <a href="https://discord.gg/Ac9aTSzV5p" target="_blank" class="text-xl text-blue-400 hover:underline">เข้าสู่ Discord ของเรา</a>
  </section>

  <!-- หน้าร้านค้า -->
  <section id="shop" class="hidden-section flex-grow flex flex-col items-center justify-center p-6 space-y-4">
    <h2 class="text-3xl text-pink-400 font-bold mb-6">หมวดหมู่สินค้า</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-gray-100 p-6 rounded-xl shadow-lg text-center">
        <h3 class="text-xl font-bold mb-2">VIP</h3>
        <p class="text-gray-400">มีสิธทิพิเศษมากมาย</p>
        <button class="mt-4 px-4 py-2 bg-pink-500 hover:bg-pink-600 rounded-full">ดูรายละเอียด</button>
      </div>
      <div class="bg-gray-100 p-6 rounded-xl shadow-lg text-center">
        <h3 class="text-xl font-bold mb-2">รถโดนเนท</h3>
        <p class="text-gray-400">ราคาเริ่มต้น 499B</p>
        <button class="mt-4 px-4 py-2 bg-pink-500 hover:bg-pink-600 rounded-full">ดูรายละเอียด</button>
      </div>
      <div class="bg-gray-100 p-6 rounded-xl shadow-lg text-center">
        <h3 class="text-xl font-bold mb-2">กาชา SS.1</h3>
        <p class="text-gray-400">ลูกละ 10บาท มีของพิเศษมากมาย!</p>
        <button class="mt-4 px-4 py-2 bg-pink-500 hover:bg-pink-600 rounded-full">ดูรายละเอียด</button>
      </div>
    </div>
  </section>

  <script>
    // showSection function definition
    function showSection(id) {
      // Hide all sections
      ['home', 'form', 'discord', 'shop'].forEach(section => {
        document.getElementById(section).style.display = section === id ? 'flex' : 'none';
      });
    }

    // Default page
    showSection('home');
  </script>
</
